name: CI

# CI 分三步：
#   1. build   —— dotnet build 全解决方案，守住代码能编译
#   2. smoke   —— 真的 docker compose up 起全套，打几条请求，证明「一条命令能跑通」
#   3. publish —— 把四个服务镜像推到 GHCR，让别人不必本地构建
#
# publish 只在 push（master / tag）时执行，PR 只做 build + smoke，不推送镜像。

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json 里钉了 10.0.302，这里只做兜底
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AspNetCoreCloud.slnx

      - name: Build
        run: dotnet build AspNetCoreCloud.slnx --no-restore -c Release --nologo

  smoke:
    name: Compose 冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 启动全套（含构建 4 个镜像）
        run: docker compose -f deploy/compose/docker-compose.yml up -d --build

      - name: 等待全部容器 healthy（Nacos 冷启动慢，最多等 4 分钟）
        run: |
          for i in $(seq 1 48); do
            pending=$(docker compose -f deploy/compose/docker-compose.yml ps --format json \
              | grep -o '"Health":"[a-z]*"' | grep -v '"Health":"healthy"' | wc -l)
            total=$(docker compose -f deploy/compose/docker-compose.yml ps --format json \
              | grep -o '"Health":"[a-z]*"' | wc -l)
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "✓ 全部 healthy（第 ${i} 轮）"
              exit 0
            fi
            sleep 5
          done
          echo "✗ 等待超时"; exit 1

      - name: 断言：网关路由来自注册中心（非 fallback）+ 三个服务都已注册
        run: |
          routes=$(curl -sS -m 10 http://localhost:10000/gateway/routes)
          echo "$routes"
          # 注意：GitHub 的 run 默认 bash -e，所以断言一律写成 if/|| 形式，
          # 不能写成 `grep -q ... && {...}`（grep 没命中会让整步直接失败）
          if echo "$routes" | grep -q '"revision":"fallback"'; then
            echo "✗ 仍是静态兜底路由，服务发现没生效"; exit 1
          fi
          for s in auth order product; do
            echo "$routes" | grep -q "\"service\":\"$s\"" || { echo "✗ 缺少服务 $s"; exit 1; }
            if echo "$routes" | grep -q "\"service\":\"$s\",\"count\":0"; then
              echo "✗ $s 实例数为 0"; exit 1
            fi
          done
          echo "✓ 三个服务均已注册，路由为动态 revision"

      - name: 断言：鉴权与跨服务调用
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://localhost:10000/api/product/test)
          [ "$code" = "401" ] || { echo "✗ 无 token 应返回 401，实际 $code"; exit 1; }
          echo "✓ 无 token -> 401"

          token=$(curl -sS -m 10 http://localhost:10000/gateway/token | grep -o '"accessToken":"[^"]*' | cut -d'"' -f4)
          [ -n "$token" ] || { echo "✗ 取不到 token"; exit 1; }
          body=$(curl -sS -m 20 -H "Authorization: Bearer $token" http://localhost:10000/api/order/lb)
          echo "$body"
          echo "$body" | grep -q "命中" || { echo "✗ order -> product 跨服务调用失败"; exit 1; }
          echo "✓ 跨服务调用 order -> product 成功"

      - name: 失败时输出全部日志
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color | tail -200

      - name: 清理
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  publish:
    name: 推送镜像到 GHCR
    # 依赖 smoke：只推「已经跑通全套 compose 冒烟」的镜像，避免把坏镜像推上去
    needs: [build, smoke]
    # push（master / tag）自动推；也可以到 Actions 页面手动 Run workflow 重推
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: src/Gateway/Dockerfile
          - service: auth
            dockerfile: src/Services/AuthService/Dockerfile
          - service: order
            dockerfile: src/Services/OrderService/Dockerfile
          - service: product
            dockerfile: src/Services/ProductService/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          # latest 只跟默认分支（master）走：tag 发布不会覆盖 latest，
          # 否则打 v2.0.0 时 latest 会被老版本镜像抢占。
          # 注意：compose 里 TAG 默认值是 latest，所以这一条必须有，
          # 不然用户不设 TAG 直接 up --no-build 会因为标签不存在而拉不到镜像。
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
